<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ingressos do  MC Cabelinho</title>
</head>
<body>
    
<main class="container">
<div class="icone">
<img src="">

</div>
<h1>Compre aqui seus Ingressos!</h1>
<p>Preencha seu formulário para garantir seu ingresso:</p>

<form id="formulario">

    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" placeholder="Digite seu nome" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" placeholder="Digite eu E-mail" required>

    <label for="telefone">Telefone:</label>
    <input type="telefone" id="telefone" placeholder="(11) 99999-9999" required>


    <label for="ingressos">Tipos de Ingressos:</label>
    <select id="ingressos">

        <option value="">Selecione uma Opção</option>
        <option value="Pista inteira">Pista 1ª (Inteira)</option>
        <option value="pista meia">Pista 1ª (Meia Entrada)</option>
        <option value="Premium">Pista Premium</option>
        <option value="Camarote">Camarote</option>

    </select>


    <label for="duvidas">Duvidas:</label>
    <textarea id="duvidas" placeholder="Tire aqui suas Duvidas"></textarea>

    <button type="submit">Pagar</button>
</form>
</main>
    <script src="./main.js"></script>
</body>
</html>
